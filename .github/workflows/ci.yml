name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly rebuild of :latest from scratch so the published image carries the newest yt-dlp,
  # pip packages and base-image fixes even when nothing was pushed (Monday 04:00 UTC).
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests tools
      - run: node --check app/static/app.js && node --check app/static/sw.js
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/browser

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Failures become annotations on the run page (the job log itself needs a login to read).
      - run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rf --tb=short tests/browser 2>&1 | tee pytest.txt || {
            grep '^FAILED' pytest.txt | head -10 | sed 's/^/::error::/'
            sed -n '/^=* FAILURES =*$/,/^=* short test summary/p' pytest.txt | head -60 | sed 's/^/::error::/'
            exit 1
          }

  image:
    name: image
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest comes only from the raw rule below (main); without latest=false a v* tag
          # would also publish latest and race the main run for it.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # A rebuild of the same commit must not change what sha-* already names (the
            # tag run carries a different APP_VERSION than the main run of the same commit).
            type=sha,enable=${{ github.event_name != 'schedule' && github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Pull requests build both platforms without pushing; pushes to main, v* tags, the weekly
      # schedule and manual runs publish. The scheduled build ignores the layer cache and pulls
      # the base image again: otherwise the cached pip layer would keep the old yt-dlp.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      # Report only: findings go to the run summary; nothing here can fail a job whose image is
      # already published (continue-on-error also covers a vulnerability DB download hiccup).
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          output: trivy.txt
      - if: steps.trivy.outcome == 'success'
        run: |
          {
            echo "## Trivy: HIGH and CRITICAL with a fix available"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: github release
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3   # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
