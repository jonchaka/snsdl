name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly rebuild of :latest from scratch so the published image carries the newest yt-dlp,
  # pip packages and base-image fixes even when nothing was pushed (Monday 04:00 UTC).
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests tools
      - run: node --check app/static/app.js && node --check app/static/sw.js
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/browser

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Failures become annotations on the run page (the job log itself needs a login to read).
      - run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rf --tb=short tests/browser 2>&1 | tee pytest.txt || {
            grep '^FAILED' pytest.txt | head -10 | sed 's/^/::error::/'
            sed -n '/^=* FAILURES =*$/,/^=* short test summary/p' pytest.txt | head -60 | sed 's/^/::error::/'
            exit 1
          }

  image:
    name: image
    needs: [check, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # A rebuild of the same commit must not change what sha-* already names.
            type=sha,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Pull requests build both platforms without pushing; pushes to main, v* tags, the weekly
      # schedule and manual runs publish. The scheduled build ignores the layer cache and pulls
      # the base image again: otherwise the cached pip layer would keep the old yt-dlp.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
