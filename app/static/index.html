<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNS Downloader</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  form { display: flex; gap: .5rem; margin-bottom: .5rem; }
  input[type=url] { flex: 1; padding: .6rem .8rem; font-size: 1rem; border: 1px solid #8884; border-radius: 6px; }
  button { padding: .6rem 1rem; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #6b7280; }
  button.small { padding: .25rem .6rem; font-size: .85rem; }
  #msg { min-height: 1.4rem; color: #dc2626; margin-bottom: .5rem; }
  #msg.ok { color: #16a34a; }
  #options { border: 1px solid #8884; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; }
  #options[hidden] { display: none; }
  #plbox[hidden] { display: none; }
  #playlists[hidden] { display: none; }
  #queuebanner[hidden] { display: none; }
  #queuebanner { margin: .75rem 0; padding: .5rem .75rem; border-radius: .4rem; background: #7c3aed22; border: 1px solid #7c3aed; font-size: .9rem; }
  #playlists { margin: .75rem 0; font-size: .9rem; }
  #playlists .pl { display: flex; align-items: center; gap: .75rem; padding: .25rem 0; }
  #playlists .pl .pltitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #playlists .plprogress { width: 6rem; }
  .ptitle { font-weight: 600; margin-bottom: .6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: .8rem; }
  legend { font-size: .85rem; color: #6b7280; }
  select { padding: .4rem .6rem; font-size: 1rem; border: 1px solid #8884; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid #8883; vertical-align: middle; }
  td.title { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.title .sub { font-size: .8rem; color: #666; }
  #pllimit { width: 5rem; }
  td.actions { white-space: nowrap; }
  td.actions a { margin-right: .6rem; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; color: #fff; }
  .badge.paused { background: #7c3aed; }
  .queued { background: #6b7280; } .downloading { background: #f59e0b; } .done { background: #16a34a; } .failed { background: #dc2626; }
  progress { width: 120px; height: 10px; }
  .error { color: #dc2626; font-size: .85rem; }
  .empty { color: #6b7280; text-align: center; padding: 2rem 0; }
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; font-size: .85rem; color: #6b7280; }
</style>
</head>
<body>
<h1>SNS Downloader</h1>

<form id="form">
  <input id="url" type="url" aria-label="Video URL" placeholder="Paste a TikTok, YouTube, Instagram or Facebook video URL" required autofocus>
  <button id="check" type="submit">Check</button>
</form>
<div id="msg" role="alert"></div>

<div id="options" hidden>
  <div id="ptitle" class="ptitle"></div>
  <div class="row">
    <fieldset>
      <legend>Output</legend>
      <label><input type="radio" name="fmt" value="mp4" checked> Video (MP4)</label>
      <label><input type="radio" name="fmt" value="mp3"> Audio (MP3)</label>
    </fieldset>
    <label>Quality <select id="quality" aria-label="Quality"></select></label>
    <button id="download" type="button">Download</button>
  </div>
  <div id="plbox" class="row" hidden>
    <label><input type="checkbox" id="plcheck"> <span id="pllabel"></span></label>
    <label>How many <input type="number" id="pllimit" min="1" step="1" disabled></label>
  </div>
</div>

<div id="queuebanner" hidden>Queue paused — downloads already running will finish; nothing new starts.</div>
<div id="playlists" hidden></div>

<table>
  <thead><tr><th>Video</th><th>Format</th><th>Size</th><th>Status</th><th>Progress</th><th></th></tr></thead>
  <tbody id="jobs"><tr><td colspan="6" class="empty">No downloads yet.</td></tr></tbody>
</table>

<footer>
  <span>Files are deleted automatically every night. <span id="status"></span></span>
  <button id="update" class="secondary" type="button">Update yt-dlp</button>
  <button id="queuetoggle" class="secondary" type="button">Pause queue</button>
  <button id="clear" class="secondary" type="button">Clear all</button>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const form = $('#form'), urlInput = $('#url'), checkBtn = $('#check'), msg = $('#msg'), tbody = $('#jobs');
const options = $('#options'), ptitle = $('#ptitle'), qualitySel = $('#quality'), downloadBtn = $('#download');
const plbox = $('#plbox'), plcheck = $('#plcheck'), pllabel = $('#pllabel'), pllimit = $('#pllimit');
const playlistsBox = $('#playlists');
const CSRF = {'X-Requested-With': 'sns-downloader'};
const MP3_QUALITIES = [['best', 'Best (VBR)'], ['320', '320 kbps'], ['192', '192 kbps']];

let probed = null; // {url, title, heights, playlist}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function detailText(body, fallback) {
  const d = body?.detail;
  if (typeof d === 'string') return d;
  return d?.[0]?.msg?.replace(/^Value error, /, '') || fallback;
}

function selectedFormat() { return document.querySelector('input[name=fmt]:checked').value; }

function fillQuality() {
  if (!probed) return;
  let opts;
  if (selectedFormat() === 'mp3') opts = MP3_QUALITIES;
  else if (probed.sizes.length) opts = probed.sizes.map(z => [String(z.height),
    (typeof z.width === 'number' && z.width < z.height) ? `${z.width}p (portrait)` : `${z.height}p`]);
  else opts = [['best', 'Best available']];
  qualitySel.innerHTML = opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  if (selectedFormat() === 'mp4' && probed.heights.includes(1080)) qualitySel.value = '1080';
}

function showOptions(url, data) {
  const heights = data.heights || [];
  const sizes = (data.sizes && data.sizes.length) ? data.sizes : heights.map(h => ({height: h, width: null}));
  probed = {url, title: data.title, heights, sizes, playlist: data.playlist || null};
  ptitle.textContent = data.title || url;
  document.querySelector('input[name=fmt][value=mp4]').checked = true;
  fillQuality();
  const pl = probed.playlist;
  if (pl) {
    const n = pl.total > pl.count ? `${pl.count} of ${pl.total}` : `${pl.count}`;
    pllabel.textContent = `Download whole playlist: ${pl.title || 'untitled'} (${n} videos)`;
    pllimit.min = 1; pllimit.max = pl.count; pllimit.value = pl.count;
    plcheck.checked = false; pllimit.disabled = true;
  }
  plbox.hidden = !pl;
  options.hidden = false;
}

function playlistLimit() {
  const max = probed.playlist.count;
  const n = parseInt(pllimit.value, 10);
  return Number.isFinite(n) ? Math.min(Math.max(n, 1), max) : max;
}

function hideOptions() { probed = null; options.hidden = true; }

function humanSize(n) {
  if (n == null) return '—';
  if (n < 1024) return `${n} B`;
  const units = ['KB', 'MB', 'GB', 'TB'];
  let v = n / 1024, i = 0;
  while (Math.round(v * 10) / 10 >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(1)} ${units[i]}`;
}

function formatLabel(j) {
  const fmt = (j.format || 'mp4').toUpperCase();
  const q = j.quality || 'best';
  if (q === 'best') return `${fmt} best`;
  return j.format === 'mp3' ? `${fmt} ${q} kbps` : `${fmt} ${q}p`;
}

function render(jobs) {
  if (!jobs.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">No downloads yet.</td></tr>'; return; }
  tbody.innerHTML = jobs.map(j => `
    <tr>
      <td class="title" title="${esc(j.url)}">${esc(j.title || j.url)}${j.playlist ? `<div class="sub">from ${esc(j.playlist)} · #${esc(j.playlist_index)}</div>` : ''}</td>
      <td>${esc(formatLabel(j))}</td>
      <td>${esc(humanSize(j.size))}</td>
      <td><span class="badge ${esc(j.status)}">${esc(j.status)}</span></td>
      <td>${j.status === 'failed' ? `<span class="error">${esc(j.error)}</span>` : `<progress aria-label="Download progress" max="100" value="${j.progress}"></progress> ${j.progress}%`}</td>
      <td class="actions">${j.status === 'done' && j.filename ? `<a href="/files/${encodeURIComponent(j.filename)}" download>Download</a>` : ''}${j.status === 'failed' ? `<button class="secondary small retry" type="button" data-id="${esc(j.id)}">Retry</button>` : j.status === 'queued' ? `<button class="secondary small pause" type="button" data-id="${esc(j.id)}">Pause</button>` : j.status === 'paused' ? `<button class="secondary small resume" type="button" data-id="${esc(j.id)}">Resume</button>` : ''}<button class="secondary small remove" type="button" data-id="${esc(j.id)}">${j.status === 'done' || j.status === 'failed' ? 'Remove' : 'Cancel'}</button></td>
    </tr>`).join('');
}

function renderPlaylists(jobs) {
  const groups = new Map();  // playlist_id -> {title, queued, downloading, finished}
  for (const j of jobs) {
    if (!j.playlist_id) continue;
    const g = groups.get(j.playlist_id) || {title: j.playlist, rows: 0, done: 0, queued: 0, downloading: 0, paused: 0, finished: 0, failed: 0};
    g.rows++;
    if (j.status === 'done') g.done++;
    if (j.status === 'queued') g.queued++;
    else if (j.status === 'downloading') g.downloading++;
    else if (j.status === 'paused') g.paused++;
    else { g.finished++; if (j.status === 'failed') g.failed++; }  // finished = done or failed
    groups.set(j.playlist_id, g);
  }
  playlistsBox.hidden = !groups.size;
  playlistsBox.innerHTML = [...groups].map(([id, g]) => {
    const title = esc(g.title || 'Playlist'), active = g.queued + g.downloading + g.paused;
    const parts = [];
    if (g.queued + g.downloading) parts.push(`${g.queued} queued, ${g.downloading} downloading`);
    if (g.paused) parts.push(`${g.paused} paused`);
    if (g.finished) parts.push(`${g.finished} finished`);
    if (g.failed) parts.push(`${g.failed} failed`);
    let html = `<div class="pl"><span class="pltitle">${title}</span>` +
      `<progress class="plprogress" aria-label="Playlist progress" max="${g.rows}" value="${g.done}"></progress>` +
      `<span>${g.done} of ${g.rows} done${parts.length ? ' · ' + parts.join(' · ') : ''}</span>`;
    if (active) html += `<button class="secondary small plcancel" type="button" data-id="${esc(id)}" data-title="${title}" data-n="${active}">Cancel remaining</button>`;
    if (g.finished) html += `<button class="secondary small plremove" type="button" data-id="${esc(id)}" data-title="${title}" data-n="${g.finished}">Remove finished</button>`;
    if (g.queued) html += `<button class="secondary small plpause" type="button" data-id="${esc(id)}">Pause queued</button>`;
    if (g.paused) html += `<button class="secondary small plresume" type="button" data-id="${esc(id)}">Resume paused</button>`;
    if (g.failed) html += `<button class="secondary small plretry" type="button" data-id="${esc(id)}" data-n="${g.failed}">Retry failed</button>`;
    return html + '</div>';
  }).join('');
}

const statusEl = $('#status'), queueToggle = $('#queuetoggle'), queueBanner = $('#queuebanner');
let queuePaused = false;
function renderStatus(s) {
  const d = s.downloads || {files: 0, bytes: 0};
  let text = `${humanSize(d.bytes)} in ${d.files} file${d.files === 1 ? '' : 's'} · yt-dlp ${s.yt_dlp_version}`;
  const u = s.update || {};
  if (u.restart_pending) text += ` · yt-dlp ${u.installed} ready, restarting when idle`;
  else if (u.error) text += ` · update failed: ${u.error}`;
  statusEl.textContent = text;
  queuePaused = !!s.queue_paused;
  queueToggle.textContent = queuePaused ? 'Resume queue' : 'Pause queue';
  queueBanner.hidden = !queuePaused;
}

const updateBtn = $('#update');
updateBtn.addEventListener('click', async () => {
  updateBtn.disabled = true;
  updateBtn.textContent = 'Updating…';
  msg.textContent = '';
  msg.className = '';
  try {
    const r = await fetch('/api/update', {method: 'POST', headers: CSRF});
    const u = r.ok ? await r.json() : null;
    if (!u) msg.textContent = `Could not update (${r.status})`;
    else if (u.error) msg.textContent = `Update failed: ${u.error}`;
    else if (u.restart_pending) { msg.className = 'ok'; msg.textContent = `yt-dlp ${u.installed} installed, restarting when idle`; }
    else { msg.className = 'ok'; msg.textContent = `yt-dlp is up to date (${u.running})`; }
  } catch (e) {
    msg.textContent = 'Could not update (network)';
  } finally {
    updateBtn.disabled = false;
    updateBtn.textContent = 'Update yt-dlp';
  }
  await refresh();
});

queueToggle.addEventListener('click', async () => {
  queueToggle.disabled = true;
  await postAction(queuePaused ? '/api/queue/resume' : '/api/queue/pause', queuePaused ? 'resume queue' : 'pause queue');
  queueToggle.disabled = false;
});

async function refresh() {
  try {
    const r = await fetch('/api/jobs');
    if (r.ok) { const jobs = await r.json(); render(jobs); renderPlaylists(jobs); }
    const st = await fetch('/api/status');
    if (st.ok) renderStatus(await st.json());
  } catch (e) { /* server restarting; try again next tick */ }
}

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  msg.textContent = '';
  msg.className = '';
  hideOptions();
  checkBtn.disabled = true;
  checkBtn.textContent = 'Checking…';
  const url = urlInput.value;
  try {
    const r = await fetch('/api/probe', {
      method: 'POST', headers: {'content-type': 'application/json', ...CSRF},
      body: JSON.stringify({url}),
    });
    if (r.status === 422) {
      msg.textContent = detailText(await r.json(), 'Could not read that URL');
    } else if (!r.ok) {
      msg.textContent = `Server error (${r.status})`;
    } else {
      const data = await r.json();
      if (urlInput.value === url) showOptions(url, data);
    }
  } catch (e) {
    msg.textContent = 'Could not reach the server';
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = 'Check';
  }
});

urlInput.addEventListener('input', hideOptions);
document.querySelectorAll('input[name=fmt]').forEach(el => el.addEventListener('change', fillQuality));
plcheck.addEventListener('change', () => { pllimit.disabled = !plcheck.checked; });

downloadBtn.addEventListener('click', async () => {
  if (!probed) return;
  msg.textContent = '';
  msg.className = '';
  downloadBtn.disabled = true;
  const wholePlaylist = !!probed.playlist && plcheck.checked;
  const payload = {url: probed.url, format: selectedFormat(), quality: qualitySel.value};
  if (wholePlaylist) payload.limit = playlistLimit();
  try {
    const r = await fetch(wholePlaylist ? '/api/playlists' : '/api/jobs', {
      method: 'POST', headers: {'content-type': 'application/json', ...CSRF},
      body: JSON.stringify(payload),
    });
    if (r.status === 422) {
      msg.textContent = detailText(await r.json(), 'Invalid request');
    } else if (!r.ok) {
      msg.textContent = `Server error (${r.status})`;
    } else {
      if (wholePlaylist) {
        const d = await r.json();
        msg.className = 'ok';
        msg.textContent = `Queued ${d.queued} video${d.queued === 1 ? '' : 's'}` + (d.reused ? `, ${d.reused} already in progress` : '');
      }
      urlInput.value = '';
      hideOptions();
      await refresh();
      urlInput.focus();
    }
  } catch (e) {
    msg.textContent = 'Could not reach the server';
  } finally {
    downloadBtn.disabled = false;
  }
});

tbody.addEventListener('click', async (ev) => {
  const actBtn = ev.target.closest('button.retry, button.pause, button.resume');
  if (actBtn) {
    const action = actBtn.classList.contains('retry') ? 'retry' : actBtn.classList.contains('pause') ? 'pause' : 'resume';
    actBtn.disabled = true;
    await postAction(`/api/jobs/${encodeURIComponent(actBtn.dataset.id)}/${action}`, action);
    return;
  }
  const btn = ev.target.closest('button.remove');
  if (!btn) return;
  const verb = btn.textContent.trim().toLowerCase();  // 'cancel' or 'remove'
  if (!confirm(`${verb === 'cancel' ? 'Cancel' : 'Remove'} this download?`)) return;
  msg.textContent = '';
  msg.className = '';
  btn.disabled = true;
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(btn.dataset.id)}`, {method: 'DELETE', headers: CSRF});
    if (!r.ok) msg.textContent = `Could not ${verb} (${r.status})`;
  } catch (e) {
    msg.textContent = `Could not ${verb} (network)`;
  }
  await refresh();
});

async function postAction(url, verb) {
  msg.textContent = '';
  msg.className = '';
  try {
    const r = await fetch(url, {method: 'POST', headers: CSRF});
    if (!r.ok) msg.textContent = `Could not ${verb} (${r.status})`;
  } catch (e) {
    msg.textContent = `Could not ${verb} (network)`;
  }
  await refresh();
}

playlistsBox.addEventListener('click', async (ev) => {
  const actBtn = ev.target.closest('button.plretry, button.plpause, button.plresume');
  if (actBtn) {
    const action = actBtn.classList.contains('plretry') ? 'retry' : actBtn.classList.contains('plpause') ? 'pause' : 'resume';
    actBtn.disabled = true;
    await postAction(`/api/playlists/${encodeURIComponent(actBtn.dataset.id)}/${action}`, action);
    return;
  }
  const btn = ev.target.closest('button.plcancel, button.plremove');
  if (!btn) return;
  const remove = btn.classList.contains('plremove');
  const n = Number(btn.dataset.n), plural = n === 1 ? '' : 's';
  const question = remove
    ? `Remove ${n} finished video${plural} of ${btn.dataset.title} and delete their files?`
    : `Cancel the remaining ${n} video${plural} of ${btn.dataset.title}?`;
  if (!confirm(question)) return;
  const verb = remove ? 'remove' : 'cancel';
  msg.textContent = '';
  msg.className = '';
  btn.disabled = true;
  try {
    const url = `/api/playlists/${encodeURIComponent(btn.dataset.id)}` + (remove ? '?status=finished' : '');
    const r = await fetch(url, {method: 'DELETE', headers: CSRF});
    if (!r.ok && r.status !== 404) msg.textContent = `Could not ${verb} (${r.status})`;  // 404: already gone
  } catch (e) {
    msg.textContent = `Could not ${verb} (network)`;
  }
  await refresh();
});

$('#clear').addEventListener('click', async () => {
  if (!confirm('Delete all downloaded files and clear the list?')) return;
  msg.textContent = '';
  msg.className = '';
  try {
    const r = await fetch('/api/cleanup', {method: 'POST', headers: CSRF});
    if (!r.ok) msg.textContent = 'Could not clear downloads';
  } catch (e) {
    msg.textContent = 'Could not clear downloads';
  }
  await refresh();
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
