services:
  sns-downloader:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
    image: sns-downloader:local
    container_name: sns-downloader
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-UTC}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-500}
      EMBED_THUMBNAILS: ${EMBED_THUMBNAILS:-1}
      UPDATE_CRON: ${UPDATE_CRON:-0 4 * * *}
      RATE_LIMIT: ${RATE_LIMIT:-}
      IMPERSONATE: ${IMPERSONATE:-chrome}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
    restart: unless-stopped
    stop_grace_period: 15s
