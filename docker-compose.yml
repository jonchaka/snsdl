services:
  sns-downloader:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
    image: sns-downloader:local
    container_name: sns-downloader
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # - ./keep:/keep   # then set KEEP_DIR=/keep
    environment:
      TZ: ${TZ:-UTC}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-500}
      EMBED_THUMBNAILS: ${EMBED_THUMBNAILS:-1}
      UPDATE_CRON: ${UPDATE_CRON:-0 4 * * *}
      RATE_LIMIT: ${RATE_LIMIT:-}
      IMPERSONATE: ${IMPERSONATE:-chrome}
      MIN_FREE_SPACE: ${MIN_FREE_SPACE:-1G}
      PROXY: ${PROXY:-}
      FRAGMENTS: ${FRAGMENTS:-1}
      MAX_PER_SITE: ${MAX_PER_SITE:-1}
      SITE_GAP: ${SITE_GAP:-3}
      KEEP_DIR: ${KEEP_DIR:-}
      ACCESS_PIN: ${ACCESS_PIN:-}
      HTTPS: ${HTTPS:-0}
      TLS_HOSTS: ${TLS_HOSTS:-}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      SPONSORBLOCK: ${SPONSORBLOCK:-0}
      PREFER_H264: ${PREFER_H264:-0}
      DOWNLOAD_WINDOW: ${DOWNLOAD_WINDOW:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SUBSCRIPTION_CRON: ${SUBSCRIPTION_CRON:-0 */6 * * *}
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      LIVE_MAX_HOURS: ${LIVE_MAX_HOURS:-12}
      MEDIA_LAYOUT: ${MEDIA_LAYOUT:-0}
    restart: unless-stopped
    # uvicorn's 3 s graceful-shutdown timeout + up to 10 s for recordings to stop + ffmpeg quit
    stop_grace_period: 30s
